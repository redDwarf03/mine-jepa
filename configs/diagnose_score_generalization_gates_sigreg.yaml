# Cold-start attempt #19, Run B, step 5 — offline gates only (no MineRL/Java).
# Re-runs the central attempt #10 diagnostic against checkpoints/ebwm.pt
# (baseline) and the SIGReg fine-tune snapshots (checkpoints/ebwm_v3_sigreg_epoch{N}.pt,
# N = however many epochs the run's own early-stop gate produced), using the
# EXPANDED hand-labeled set from attempt #18's follow-up (tree_close n=10,
# no_tree n=17). Identical to configs/diagnose_score_generalization_gates.yaml
# (Run A) EXCEPT: gates.treechop_direction_check_enabled: false — Run A's own
# diagnostic found the baseline itself already failed that sub-test (invalidated
# premise), so Run B does not re-gate on it; Gate C here is magnitude/band only.

seed: 0

goal:
  data_path: data/minerl_goal/episodes.npz
  threshold: 0.5
  min_frames: 10
  mode: centroid

planner:
  n_actions: 17
  horizon: 12
  n_candidates: 512
  sticky_prob: 0.5

treechop:
  data_path: data/minerl_goal/episodes.npz
  n_episodes: 40
  offsets: [0.0, 0.1, 0.25, 0.5]
  n_thumbs: 0

obtain:
  spawn_thumb_dir: assets/spawn_thumbs
  coverage_data_path: data/minerl_coverage/episodes.npz
  coverage_chunk_size: 400
  coverage_n_chunks: 20
  coverage_offsets: [0.0, 0.1, 0.25, 0.5]

direction_check:
  spawn_tree_close: ["ep001_1784647176868", "ep001_1784647708743", "ep001_1784647301681", "ep001_1784647943879"]
  spawn_no_tree: ["ep001_1784633396270", "ep001_1784633525602", "ep001_1784647041967", "ep001_1784647444573", "ep001_1784633250670", "ep001_1784647828624"]
  coverage_tree_close: [0, 7, 11, 12, 15, 18]
  coverage_no_tree: [1, 5, 2, 4, 6, 8, 10, 13, 14, 17, 19]

baseline_name: baseline

checkpoints:
  baseline: checkpoints/ebwm.pt
  epoch1: checkpoints/ebwm_v3_sigreg_epoch1.pt
  # epoch2/epoch3 do not exist — training early-stopped after epoch 1
  # (dimensional collapse: effective_rank 4.50 < 0.5x baseline 26.69).

gates:
  min_separation_ratio: 1.3
  max_brightness_corr: 0.3
  treechop_regression_band: [0.5, 2.0]
  treechop_direction_offsets: [0.0, 0.5]
  treechop_direction_check_enabled: false   # Run B: magnitude/band only, per the invalidated Run A sub-test

output:
  dir: assets/diagnostics
  csv_name: score_generalization_gates_sigreg.csv
  json_name: score_generalization_gates_sigreg.json
