# Cold-start attempt #16 candidate (Coverage-Value Predictor), Gate-1 fix:
# clone of configs/play_craft_commit4_hazard.yaml with ONE change --
# scan.frontier.tie_break: random. The prior batch (logs/coverage_transitions.csv,
# 57 rows) found frontier_heading_deg()'s original tie-break (mine_jepa/ebwm/
# frontier.py, ties resolved toward the smallest heading index) returned
# heading 0.0deg on 54/57 triggers by construction, because every candidate
# tied at visit_count==0 in this sparse-grid regime -- making Gate 1 (dynamic
# range of realized payoff BY chosen heading) uncertifiable from that data.
# tie_break: random breaks ties uniformly among ALL tied candidates via a
# seeded RNG (mine_jepa/ebwm/frontier.py FrontierTracker.__init__), so this
# config's collected CSV should show real heading diversity. Everything else
# byte-for-byte identical to play_craft_commit4_hazard.yaml -- this file
# exists ONLY to isolate the tie_break change from the validated production
# configs, which keep tie_break: first (the default) untouched.

minerl_env: MineRLObtainIronPickaxeDense-v0
actions_config: configs/minerl_actions_obtain.yaml

model:
  checkpoint: checkpoints/craft_wm_v4.pt

planner:
  n_actions: 22
  horizon: 12
  n_candidates: 512
  sticky_prob: 0.5
  w_log: 1.0
  w_planks: 2.0
  log_threshold: 0.05
  commit_length: 4

scan:
  enabled: true
  macro: frontier
  flat_threshold: 0.003    # Treechop-calibrated (docs/10), valid here because the
                            # two-brain chop_planner IS ebwm.pt, not craft_wm_v4
  patience: 3
  max_replans: 40
  log_std: true            # mandatory per the attempt #4 RND lesson: never ship
                            # an instrumented mechanism without its own diagnostic print
  frontier:
    cell_size: 4.0          # arbitrary dead-reckoning units per grid cell
    move_step: 1.0          # per-tick forward/strafe unit at normal (non-sprint) speed
    sprint_mult: 1.6        # sprint actions (a13/a14) move faster than plain forward (a1/a7)
    lookahead_cells: 2.0    # project candidate headings this many cells ahead
    n_headings: 12          # candidate directions sampled around the full circle (30° apart)
    alignment_deg: 15.0     # turn toward the frontier heading until within this many degrees
    turn_left_action: 11
    turn_right_action: 12
    forward_action: 13
    jump_action: 8
    jump_every: 4
    max_ticks: 30
    # Gate-1 fix (this config's one change vs. play_craft_commit4_hazard.yaml):
    # break ties among candidate headings uniformly at random instead of always
    # picking the smallest heading index. tie_break_seed defaults to
    # agent.seed (0) if unset -- kept explicit here for clarity.
    tie_break: random
    tie_break_seed: 0
    # Cold-start attempt #16 candidate (Coverage-Value Predictor) offline
    # validation-gate instrumentation, docs/10_coldstart_engineering.md. Logs
    # one CSV row per scan-macro trigger tick (chosen heading, local visitation
    # histogram, a classical frame-diff flow summary, brightness, and the
    # REALIZED delta_unique_cells ~log_transitions_k ticks later). Does not
    # change chop/craft behaviour in any way -- pure logging, additive.
    # Written to a NEW path so the prior tie_break=first batch
    # (logs/coverage_transitions.csv, 57 rows) is not overwritten.
    log_transitions: true
    log_transitions_k: 20
    log_transitions_path: logs/coverage_transitions_tiebreak.csv

# Cold-start attempt #13: calibrated against TWO real drowning deaths, one
# bright daytime, one dark night (docs/10, mine_jepa/ebwm/hazard.py docstring
# has the full calibration data from both rounds -- an initial absolute-
# threshold version was recalibrated to relative/ratio thresholds after it
# missed the night drowning). Zero false positives across ~5900 pooled
# survived frames from three episodes (bright daytime, dusk, forest, sky-only).
hazard_avoidance:
  enabled: true
  ratio_thresh: 1.02
  rel_rg_thresh: 0.15
  patience: 1               # react immediately -- drowning is time-critical
  max_ticks: 60             # bounded escape budget per trigger before rechecking
  jump_every: 2             # jump (surface, refill air) every other tick
  jump_action: 5            # pure jump, no forward -- don't swim further from land
  retreat_action: 2         # blind fallback only, if no dry position recorded yet
  align_deg: 85.0           # turn toward the remembered dry point until within this many degrees
  dry_anchor_debounce: 2    # consecutive not-underwater checks required before trusting the anchor
  turn_right_action: 12
  turn_left_action: 11
  forward_action: 1         # plain walk (not sprint) toward the remembered dry point
  log: true                 # mandatory per the attempt #4 RND lesson

chop_model:
  checkpoint: checkpoints/ebwm.pt
  n_actions: 17
  goal:
    data_path: data/minerl_goal/episodes.npz
    threshold: 0.5
    min_frames: 10
    mode: centroid

goal:
  data_path: data/minerl_craft/episodes.npz
  chop_reward_threshold: 0.5

agent:
  episodes: 14
  max_steps: 3000
  action_repeat: 4
  seed: 0

logging:
  save_gif: true
  gif_episodes: 14
  gif_path: assets/agent_play_craft_commit4_hazard_tiebreak.gif
