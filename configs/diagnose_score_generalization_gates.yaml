# Cold-start attempt #19, Run A, step 4 — offline gates only (no MineRL/Java).
# Re-runs the central attempt #10 diagnostic (scripts/diagnose_score_generalization.py's
# goal_score_std computation) against checkpoints/ebwm.pt (baseline) and the 5
# action-coverage-fix fine-tune snapshots (checkpoints/ebwm_v3_actioncoverage_epoch{1..5}.pt),
# using the EXPANDED hand-labeled set from attempt #18's follow-up (tree_close
# n=10, no_tree n=17 — copied verbatim from configs/diagnose_depth_gate.yaml's
# direction_check block, NOT the original small n=4/6 set that produced a false
# GO on Diagnostic 1).

seed: 0

# Same chop-goal centroid every prior diagnostic in this campaign has used
# (configs/diagnose_score_generalization.yaml / play_ebwm.yaml).
goal:
  data_path: data/minerl_goal/episodes.npz
  threshold: 0.5
  min_frames: 10
  mode: centroid

planner:
  n_actions: 17
  horizon: 12
  n_candidates: 512
  sticky_prob: 0.5

treechop:
  data_path: data/minerl_goal/episodes.npz
  n_episodes: 40
  offsets: [0.0, 0.1, 0.25, 0.5]
  n_thumbs: 0

obtain:
  spawn_thumb_dir: assets/spawn_thumbs
  coverage_data_path: data/minerl_coverage/episodes.npz
  coverage_chunk_size: 400
  coverage_n_chunks: 20
  coverage_offsets: [0.0, 0.1, 0.25, 0.5]

# Copied verbatim from configs/diagnose_depth_gate.yaml (attempt #18's
# EXPANDED, larger-sample hand-labeled set).
direction_check:
  spawn_tree_close: ["ep001_1784647176868", "ep001_1784647708743", "ep001_1784647301681", "ep001_1784647943879"]
  spawn_no_tree: ["ep001_1784633396270", "ep001_1784633525602", "ep001_1784647041967", "ep001_1784647444573", "ep001_1784633250670", "ep001_1784647828624"]
  coverage_tree_close: [0, 7, 11, 12, 15, 18]
  coverage_no_tree: [1, 5, 2, 4, 6, 8, 10, 13, 14, 17, 19]

baseline_name: baseline

checkpoints:
  baseline: checkpoints/ebwm.pt
  epoch1: checkpoints/ebwm_v3_actioncoverage_epoch1.pt
  epoch2: checkpoints/ebwm_v3_actioncoverage_epoch2.pt
  epoch3: checkpoints/ebwm_v3_actioncoverage_epoch3.pt
  epoch4: checkpoints/ebwm_v3_actioncoverage_epoch4.pt
  epoch5: checkpoints/ebwm_v3_actioncoverage_epoch5.pt

gates:
  min_separation_ratio: 1.3     # Gate A + Gate C direction bar, same as attempts #7-#18
  max_brightness_corr: 0.3      # Gate B bar
  treechop_regression_band: [0.5, 2.0]   # Gate C median band vs baseline
  treechop_direction_offsets: [0.0, 0.5]  # Gate C near/far pair within Treechop

output:
  dir: assets/diagnostics
  csv_name: score_generalization_gates.csv
  json_name: score_generalization_gates.json
