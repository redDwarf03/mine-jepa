# Phase 4c — MPC agent with action-conditioned world model (eb_jepa)

minerl_env: MineRLTreechop-v0
actions_config: configs/minerl_actions.yaml

model:
  checkpoint: checkpoints/ebwm.pt

planner:
  n_actions: 17
  horizon: 12
  n_candidates: 512
  sticky_prob: 0.5      # 0.0 = i.i.d. uniform (original). 0.6-0.7 = iCEM-lite sticky
                        # sampling: candidate sequences contain sustained gestures
                        # ("turn 6 steps then walk"), which i.i.d. almost never draws.

# Scan macro (cold-start, docs/10): when the goal-score std across candidates is
# ~0, no tree is in view and the planner is picking among lottery tickets → force
# a camera-yaw sweep until the std recovers. One scan replan = 10° × action_repeat.
# Calibrate flat_threshold first: scan.enabled=false + log_std=true on 2-3 episodes,
# read the std when a tree is visible vs not.
scan:
  enabled: true
  flat_threshold: 0.003 # calibrated 2026-07-07 (3 ep Treechop): lost band <=0.002, tree-visible >=0.02
  patience: 3           # consecutive flat replans before the sweep triggers
  turn_action: 12       # camera [0, +10°] — turn right (configs/minerl_actions.yaml)
  max_replans: 40       # sweep guard; 9 replans ≈ 360° at action_repeat=4
  log_std: false        # print goal_score_std at every replan (calibration mode)

goal:
  data_path: data/minerl_goal/episodes.npz
  threshold: 0.5
  min_frames: 10
  mode: centroid        # centroid (50%, forces movement) | nearest (freezes agent)
  n_prototypes: 256     # used only if mode: nearest

agent:
  episodes: 20
  max_steps: 3000
  action_repeat: 4      # re-plan every 4 steps → 4× faster + sustained attack
  seed: 0

logging:
  print_every: 1
  save_gif: true
  gif_episodes: 3
  gif_path: assets/agent_play_ebwm.gif
