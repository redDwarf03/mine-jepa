# Cold-start attempt #7 (docs/10): same as play_craft_commit4.yaml (two-brain,
# sticky 0.5, scan off, commit_length=4) but the two-brain chop planner's goal
# distance is now a TRAINED metric (checkpoints/value_projector.pt) instead of
# ebwm.pt's raw-latent squared-L2 — isolating this one mechanism, same convention
# as every other cold-start attempt tonight.

minerl_env: MineRLObtainIronPickaxeDense-v0
actions_config: configs/minerl_actions_obtain.yaml

model:
  checkpoint: checkpoints/craft_wm_v4.pt

planner:
  n_actions: 22
  horizon: 12
  n_candidates: 512
  sticky_prob: 0.5
  w_log: 1.0
  w_planks: 2.0
  log_threshold: 0.05
  commit_length: 4

scan:
  enabled: false
  flat_threshold: 0.004
  patience: 3
  turn_action: 12
  max_replans: 40
  log_std: true   # diagnostic only (scan.enabled: false -> no behaviour change);
                   # lets the Tester compare goal_score_std separation against the
                   # raw-distance version's compressed bands (docs/10 attempt #2).

chop_model:
  checkpoint: checkpoints/ebwm.pt
  n_actions: 17
  distance_projector: checkpoints/value_projector.pt
  goal:
    data_path: data/minerl_goal/episodes.npz
    threshold: 0.5
    min_frames: 10
    mode: centroid

goal:
  data_path: data/minerl_craft/episodes.npz
  chop_reward_threshold: 0.5

agent:
  episodes: 5
  max_steps: 3000
  action_repeat: 4
  seed: 0

logging:
  save_gif: true
  gif_episodes: 3
  gif_path: assets/agent_play_craft_commit4_value.gif
