# Cold-start attempt #5 (docs/10): commit_length=4 (attempt #4, first non-zero
# cold-start result, 3/31) + scan re-enabled in two-brain mode. Everything else
# identical to play_craft_commit4.yaml. The scan macro reads goal_score_std from
# chop_planner (checkpoints/ebwm.pt) whenever mode == "chop" (verified in
# scripts/play_craft.py: chop_planner.plan() returns its own info dict, read
# before the SwitchingCraftPlanner/craft_wm_v4 branch is ever reached) — the
# exact model the 0.003/patience=3/max_replans=40 calibration (docs/10,
# "Calibrating the threshold", 2026-07-07 Treechop run) was measured on, not
# craft_wm_v4's compressed bands that broke scan in attempt #2.

minerl_env: MineRLObtainIronPickaxeDense-v0
actions_config: configs/minerl_actions_obtain.yaml

model:
  checkpoint: checkpoints/craft_wm_v4.pt

planner:
  n_actions: 22
  horizon: 12
  n_candidates: 512
  sticky_prob: 0.5
  w_log: 1.0
  w_planks: 2.0
  log_threshold: 0.05
  commit_length: 4

scan:
  enabled: true            # attempt #5: re-enabled, reading ebwm.pt's std via chop_planner
  flat_threshold: 0.003    # the Treechop-calibrated value (docs/10), valid here because
                            # the two-brain chop_planner IS ebwm.pt, not craft_wm_v4
  patience: 3
  turn_action: 12
  max_replans: 40
  log_std: true            # instrumented per the RND part-B lesson: never ship a scan
                            # run without the diagnostic print that shows whether/when
                            # it actually fires

chop_model:
  checkpoint: checkpoints/ebwm.pt
  n_actions: 17
  goal:
    data_path: data/minerl_goal/episodes.npz
    threshold: 0.5
    min_frames: 10
    mode: centroid

goal:
  data_path: data/minerl_craft/episodes.npz
  chop_reward_threshold: 0.5

agent:
  episodes: 5
  max_steps: 3000
  action_repeat: 4
  seed: 0

logging:
  save_gif: true
  gif_episodes: 3
  gif_path: assets/agent_play_craft_commit4_scan.gif
