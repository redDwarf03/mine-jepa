# Cold-start attempt #8 (docs/10): commit_length=4 (attempt #4, the only lever that
# has ever produced a non-zero cold-start result, 3/31) + Proposal A (action-pool
# priming, mine_jepa/ebwm/planner.py _sample_actions) + Proposal C (bushwhack cruise
# macro, scripts/play_craft.py) on the two-brain chop planner. Everything else
# identical to configs/play_craft_commit4_scan.yaml.
#
# Standing diagnosis (CLAUDE.md, docs/10): the wall is BEHAVIOURAL, not perceptual —
# online RND, real CEM, and a trained cost-to-reach metric all failed to move it.
# Proposal A puts hand-authored "clean" gestures (sustained forward+attack,
# continuous camera-turn, walk-backward) directly into the 512-candidate MPC pool
# so the argmax can pick one when nothing else scores well. Proposal C replaces the
# scan macro's turn-in-place reflex with a bounded forward-sprint+jump cruise for
# spawns where turning alone can never find anything (attempt #5's treeless
# underground episode).

minerl_env: MineRLObtainIronPickaxeDense-v0
actions_config: configs/minerl_actions_obtain.yaml

model:
  checkpoint: checkpoints/craft_wm_v4.pt

planner:
  n_actions: 22
  horizon: 12
  n_candidates: 512
  sticky_prob: 0.5
  w_log: 1.0
  w_planks: 2.0
  log_threshold: 0.05
  commit_length: 4
  action_pool_priming:
    enabled: true
    n_forward_attack: 30
    n_turn: 30
    n_backward: 30

scan:
  enabled: true             # attempt #5's calibration, reading ebwm.pt's std via chop_planner
  macro: bushwhack          # attempt #8, Proposal C: forward-sprint+jump cruise, not turn-in-place
  flat_threshold: 0.003     # the Treechop-calibrated value (docs/10), valid here because
                             # the two-brain chop_planner IS ebwm.pt, not craft_wm_v4
  patience: 3
  bushwhack_forward_action: 13   # sprint + forward
  bushwhack_jump_action: 8       # forward + jump (hops 1-block obstacles)
  bushwhack_jump_every: 4
  bushwhack_max_ticks: 30        # bounded cruise, rechecks std every replan (every commit_length ticks)
  max_replans: 40
  log_std: true             # never ship a scan run without the diagnostic that shows whether it fires

chop_model:
  checkpoint: checkpoints/ebwm.pt
  n_actions: 17
  goal:
    data_path: data/minerl_goal/episodes.npz
    threshold: 0.5
    min_frames: 10
    mode: centroid

spawn_diag:
  enabled: true             # docs/10 attempt #8 follow-up: distinguish "algorithm
  thumb_dir: assets/spawn_thumbs   # didn't find a tree" from "no tree within reach"
  std_viable_threshold: 0.005       # in future batches on this exact config

goal:
  data_path: data/minerl_craft/episodes.npz
  chop_reward_threshold: 0.5

agent:
  episodes: 5
  max_steps: 3000
  action_repeat: 4
  seed: 0

logging:
  save_gif: true
  gif_episodes: 3
  gif_path: assets/agent_play_craft_commit4_ac.gif
