# Cold-start attempt #8, Proposal B (docs/10): commit_length=4 two-brain chop
# planner (checkpoints/ebwm.pt) with a BC-actor candidate prior
# (checkpoints/actor_bc.pt, mine_jepa/ebwm/actor.py) replacing/supplementing the
# uniform+sticky sampling — the actor PROPOSES, the world-model-based MPC still
# scores and re-plans every step. Deliberately isolated from Proposal A/C
# (action_pool_priming, bushwhack scan) so any effect seen is attributable to
# the actor alone. spawn_diag on (docs/10 attempt #8 follow-up) for the same
# sanity run.

minerl_env: MineRLObtainIronPickaxeDense-v0
actions_config: configs/minerl_actions_obtain.yaml

model:
  checkpoint: checkpoints/craft_wm_v4.pt

planner:
  n_actions: 22
  horizon: 12
  n_candidates: 512
  sticky_prob: 0.5
  w_log: 1.0
  w_planks: 2.0
  log_threshold: 0.05
  commit_length: 4

scan:
  enabled: false
  flat_threshold: 0.004
  patience: 3
  turn_action: 12
  max_replans: 40
  log_std: false

chop_model:
  checkpoint: checkpoints/ebwm.pt
  n_actions: 17
  goal:
    data_path: data/minerl_goal/episodes.npz
    threshold: 0.5
    min_frames: 10
    mode: centroid
  actor_prior:
    enabled: true
    checkpoint_path: checkpoints/actor_bc.pt
    n_actor_samples: 128
    temperature: 1.0

goal:
  data_path: data/minerl_craft/episodes.npz
  chop_reward_threshold: 0.5

spawn_diag:
  enabled: true
  thumb_dir: assets/spawn_thumbs
  std_viable_threshold: 0.005

agent:
  episodes: 3
  max_steps: 3000
  action_repeat: 4
  seed: 0

logging:
  save_gif: true
  gif_episodes: 3
  gif_path: assets/agent_play_craft_commit4_actor.gif
