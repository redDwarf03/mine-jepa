# Cold-start attempt #3 (docs/10 follow-up): cheap self-supervised coverage frames.
# Random-policy, random-spawn ObtainIronPickaxeDense episodes — no reward/craft label
# needed, just wide biome exposure (treeless plains, ravines, ...) that the 40 expert
# demos underrepresent (experts reach wood fast). Short episodes cap Java-launch/death
# risk under a random policy; this is pure visual-distribution coverage, not a play eval.
env: minerl
minerl_env: MineRLObtainIronPickaxeDense-v0
episodes: 1
max_steps_per_episode: 400
seed: 42
out_dir: data/minerl_coverage
save_gif: false
gif_episodes: 0
frame_size: [64, 64]
actions_config: configs/minerl_actions_obtain.yaml
