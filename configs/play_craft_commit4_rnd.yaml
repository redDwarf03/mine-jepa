# Cold-start attempt: commit_length=4 (docs/10) + online RND (docs/09/10,
# mine_jepa/ebwm/rnd.py) on the two-brain chop planner. Same base as
# configs/play_craft_commit4.yaml (two-brain, sticky 0.5, scan off) — only
# addition is the rnd: block below, wired into chop_planner (DiscreteLatentPlanner
# on ebwm.pt). novelty_coeff=0.5 (not 1.0): a prior offline experiment
# (docs/09_curiosity_coldstart.md) found λ=1.0 fully swamped the goal-directed
# term — keep goal-centroid dominant, novelty as a tiebreaker for flat/lost moments.

minerl_env: MineRLObtainIronPickaxeDense-v0
actions_config: configs/minerl_actions_obtain.yaml

model:
  checkpoint: checkpoints/craft_wm_v4.pt

planner:
  n_actions: 22
  horizon: 12
  n_candidates: 512
  sticky_prob: 0.5
  w_log: 1.0
  w_planks: 2.0
  log_threshold: 0.05
  commit_length: 4

scan:
  enabled: false
  flat_threshold: 0.004
  patience: 3
  turn_action: 12
  max_replans: 40
  log_std: false

chop_model:
  checkpoint: checkpoints/ebwm.pt
  n_actions: 17
  goal:
    data_path: data/minerl_goal/episodes.npz
    threshold: 0.5
    min_frames: 10
    mode: centroid

rnd:
  enabled: true
  novelty_coeff: 0.5
  lr: 0.001
  buffer_size: 256
  batch_size: 32
  update_every: 4

goal:
  data_path: data/minerl_craft/episodes.npz
  chop_reward_threshold: 0.5

agent:
  episodes: 5
  max_steps: 3000
  action_repeat: 4
  seed: 0

logging:
  save_gif: true
  gif_episodes: 3
  gif_path: assets/agent_play_craft_commit4_rnd.gif
